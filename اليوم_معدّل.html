const RB=.12,HR=[0,.5,1.2,2,2.8,3.6],RR=.125,UM=[0,4,10],SR=.75;
function rentOf(s,i,o,ds){
  const t=T[i];
  if(t[0]==='p'){
    const l=s.hs[i]||0;
    let r;
    if(l)r=Math.round(t[2]*HR[l]);
    else{const n=G[t[3]].filter(k=>s.own[k]===o).length;r=Math.round(t[2]*RB*Math.max(n,1))}
    return evAdj(s,r,t);
  }
  if(t[0]==='r'){const k=oc(s,o).filter(x=>T[x][0]==='r').length;return evAdj(s,Math.round(t[2]*RR*2**(k-1)),t)}
  const k=oc(s,o).filter(x=>T[x][0]==='u').length;return evAdj(s,ds*(s.x10?10:UM[Math.min(k,2)]),t);
}
const evOn=s=>s.ev&&s.ev.u>=(s.rd||1);
function evAdj(s,r,t){
  if(!evOn(s))return r;
  if(s.ev.t==='free')return 0;
  if(s.ev.t==='boost'&&t[0]==='p'&&t[3]===s.ev.g)return r*2;
  return r;
}
function netWorth(s,u){
  if(s.out[u])return 0;
  let v=s.cash[u]||0;
  oc(s,u).forEach(i=>{const t=T[i];v+=s.mort[i]?t[2]/2:t[2];if(t[0]==='p')v+=(s.hs[i]||0)*HC[t[3]]});

}

/* ===== موسيقى هادئة (تُولَّد داخل المتصفح، بدون ملفات) ===== */

  const c=MU.ctx,b=c.createGain();b.gain.value=1;b.connect(MU.master);const ds=c.createGain();ds.gain.value=.2;b.connect(ds);ds.connect(MU.dly);b.connect(MU.rvS);return b;

  const rl=c.sampleRate*2.6|0,ir=c.createBuffer(2,rl,c.sampleRate);
  for(let ch=0;ch<2;ch++){const id=ir.getChannelData(ch);for(let i=0;i<rl;i++)id[i]=(Math.random()*2-1)*Math.pow(1-i/rl,2.8)}
  MU.rv=c.createConvolver();MU.rv.buffer=ir;MU.rvS=c.createGain();MU.rvS.gain.value=.32;MU.rvS.connect(MU.rv);MU.rv.connect(MU.master);

}
function muNote(f,t,dur,type,vol,att){

/* ===== آلات صوتية (تُولَّد داخل المتصفح بدون ملفات) ===== */

function mEnv(g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function sn(t,f0,d,v,f1){const c=MU.ctx,o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1||f0*.5,t+d);mEnv(g,t,.002,d,v);o.connect(g);g.connect(MU.bus);o.start(t);o.stop(t+d+.05)}
function nz(t,d,type,fq,q,v){const c=MU.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=MU.nb;f.type=type;f.frequency.value=fq;f.Q.value=q;mEnv(g,t,.001,d,v);s.connect(f);f.connect(g);g.connect(MU.bus);s.start(t,Math.random()*.5);s.stop(t+d+.05)}
const dHat=(t,v,op)=>nz(t,op?.2:.045,'highpass',7500,.7,v);
const dSnare=(t,v)=>{nz(t,.16,'bandpass',1900,.9,v);sn(t,190,.08,v*.6)};
const dTak=(t,v)=>{nz(t,.06,'bandpass',3600,1.2,v);sn(t,420,.05,v*.5,300)};
const dKick=(t,v)=>sn(t,130,.28,v,42);
const dDum=(t,v)=>sn(t,170,.3,v,75);
function iPluck(m,t,d,v){const c=MU.ctx,f=mtof(m),o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),g2=c.createGain(),lp=c.createBiquadFilter();o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.35;lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(6000,f*8),t);lp.frequency.exponentialRampToValueAtTime(Math.max(300,f*1.5),t+d);mEnv(g,t,.008,d,v);o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(MU.bus);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1)}
function iRhodes(m,t,d,v){const c=MU.ctx,f=mtof(m),car=c.createOscillator(),mod=c.createOscillator(),mg=c.createGain(),g=c.createGain(),tn=c.createOscillator(),tg=c.createGain();car.type='sine';car.frequency.value=f;mod.type='sine';mod.frequency.value=f;mg.gain.setValueAtTime(f*1.6,t);mg.gain.exponentialRampToValueAtTime(f*.15,t+d*.7);mod.connect(mg);mg.connect(car.frequency);tn.type='sine';tn.frequency.value=f*7;tg.gain.setValueAtTime(v*.18,t);tg.gain.exponentialRampToValueAtTime(.0001,t+.22);mEnv(g,t,.006,d,v);car.connect(g);tn.connect(tg);tg.connect(g);g.connect(MU.bus);[car,mod,tn].forEach(o=>{o.start(t);o.stop(t+d+.1)})}
function iPad(m,t,d,v){const c=MU.ctx,f=mtof(m),g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.Q.value=.6;lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1400,t+d*.5);lp.frequency.linearRampToValueAtTime(600,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d*.35);g.gain.linearRampToValueAtTime(.0001,t+d);[-6,6].forEach(dt=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+d+.05)});lp.connect(g);g.connect(MU.bus)}
function iBass(m,t,d,v){const c=MU.ctx,f=mtof(m),o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),g2=c.createGain(),lp=c.createBiquadFilter();o.type='sine';o.frequency.value=f;o2.type='triangle';o2.frequency.value=f;g2.gain.value=.3;lp.type='lowpass';lp.frequency.value=420;mEnv(g,t,.012,d,v);o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(MU.bus);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1)}
function iBell(m,t,d,v){const c=MU.ctx,f=mtof(m),car=c.createOscillator(),mod=c.createOscillator(),mg=c.createGain(),g=c.createGain();car.type='sine';car.frequency.value=f;mod.type='sine';mod.frequency.value=f*3.5;mg.gain.setValueAtTime(f*1.8,t);mg.gain.exponentialRampToValueAtTime(f*.05,t+d*.8);mod.connect(mg);mg.connect(car.frequency);mEnv(g,t,.004,d,v);car.connect(g);g.connect(MU.bus);car.start(t);mod.start(t);car.stop(t+d+.1);mod.stop(t+d+.1)}
function iPiano(m,t,d,v){const c=MU.ctx,f=mtof(m),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(7000,f*10);lp.connect(MU.bus);[[1,1],[2,.5],[3,.22],[4,.12],[5,.06]].forEach(([h,a])=>{if(f*h>9000)return;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f*h;mEnv(g,t,.004,d/Math.sqrt(h),v*a);o.connect(g);g.connect(lp);o.start(t);o.stop(t+d+.1)})}
function iOud(m,t,d,v){const c=MU.ctx,f=mtof(m),g=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.Q.value=2;lp.frequency.setValueAtTime(Math.min(5000,f*9),t);lp.frequency.exponentialRampToValueAtTime(Math.max(250,f*1.6),t+d);mEnv(g,t,.004,d,v);lp.connect(g);g.connect(MU.bus);[0,7].forEach(dt=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+d+.1)})}
/* ===== المقاطع الخمسة ===== */
const CAF=[{b:38,v:[53,57,60,64]},{b:43,v:[53,59,62,64]},{b:48,v:[59,62,64,67]},{b:45,v:[55,60,64,67]},{b:38,v:[53,57,60,64]},{b:43,v:[53,59,62,64]},{b:48,v:[59,62,64,67]},{b:48,v:[57,60,64,67]}];
const PC5=[60,62,64,67,69,72,74,76,79,81];
const AMB=[{b:36,v:[52,55,59,62]},{b:45,v:[55,59,60,64]},{b:41,v:[57,60,64,67]},{b:43,v:[59,62,64,69]}],BEL=[72,74,76,79,81,84,86];
const PNO=[{b:43,v:[55,59,62,67]},{b:38,v:[50,57,62,66]},{b:40,v:[52,59,64,67]},{b:36,v:[48,55,60,64]},{b:43,v:[55,59,62,67]},{b:38,v:[50,57,62,66]},{b:36,v:[48,55,60,64]},{b:38,v:[50,57,62,66]}],PG=[67,69,71,74,76,79];
const LOF=[{b:45,v:[55,59,60,64]},{b:50,v:[53,57,60,64]},{b:43,v:[53,59,62,64]},{b:48,v:[59,62,64,67]}],PAM=[69,72,74,76,79,81,84];
const HJ=[62,63,66,67,69,70,72,74,75,78,79,81];
const TRK=[
  {n:'مقهى',f(t){ /* جاز هادئ: إلكتريك بيانو + باص + فرشاة */
    const n=MU.step++,k=n%8,bi=(n/8|0)%8,ch=CAF[bi],st=MU.st;
    if(k===0){
      ch.v.forEach((m,i)=>iRhodes(m,t+i*.014,1.6,.05));
      st.mel={};if(st.mi===undefined)st.mi=4;
      if(Math.random()<.7){const ks=[1,2,3,4,5,6,7].sort(()=>Math.random()-.5).slice(0,2+(Math.random()*2|0)).sort((a,b)=>a-b);ks.forEach(x=>{st.mi=Math.max(0,Math.min(9,st.mi+rnd([-2,-1,-1,1,1,2])));st.mel[x]=PC5[st.mi]})}
    }
    if((k===3||k===6)&&Math.random()<.85)ch.v.forEach((m,i)=>iRhodes(m,t+i*.01,.4,.03));
    if(k===0)iBass(ch.b,t,.6,.16);
    if(k===4)iBass(ch.b+7,t,.5,.12);
    if(k===7&&Math.random()<.5)iBass(CAF[(bi+1)%8].b+rnd([1,-1]),t,.25,.1);
    if(st.mel&&st.mel[k])iPluck(st.mel[k],t,1.3,.085);
    if(k===0)dKick(t,.2);else if(k===5&&Math.random()<.4)dKick(t,.13);
    if(k===2||k===6)dSnare(t,.05);
    dHat(t,k%2?.05:.03,false);
    return t+(k%2?.27:.40);
  }},
  {n:'هدوء',f(t){ /* أجواء: وسائد دافئة وأجراس متفرقة */
    const n=MU.step++,ch=AMB[n%4];
    ch.v.forEach((m,i)=>iPad(m,t+i*.4,10,.03));
    iPad(ch.b,t,10,.05);iPad(ch.b+12,t+.2,10,.02);
    const nb=2+(Math.random()*3|0);
    for(let i=0;i<nb;i++)iBell(rnd(BEL),t+.8+Math.random()*6.2,3.4,.045);
    return t+8;
  }},
  {n:'بيانو',f(t){ /* بيانو رقيق: أربيجيو ولحن بطيء */
    const n=MU.step++,k=n%8,bi=(n/8|0)%8,ch=PNO[bi],st=MU.st,AP=[0,1,2,3,2,1,2,1];
    if(k===0){iPiano(ch.b,t,3,.09);iPad(ch.v[1],t,4.2,.018);iPad(ch.v[2],t,4.2,.016)}
    iPiano(ch.v[AP[k]],t,1.5,.055*(.85+Math.random()*.3));
    if((k===0||k===4)&&Math.random()<.55){if(st.pi===undefined)st.pi=2;st.pi=Math.max(0,Math.min(5,st.pi+rnd([-2,-1,0,1,2])));iPiano(PG[st.pi],t+.01,2.6,.075)}
    return t+.44+Math.random()*.012-.006;
  }},
  {n:'ليل',f(t){ /* لو-فاي: إيقاع ناعم وإلكتريك بيانو */
    const n=MU.step++,k=n%8,bar=(n/8|0)%8,ch=LOF[bar>>1],st=MU.st;
    if(k===0)ch.v.forEach((m,i)=>iRhodes(m,t+i*.02,1.9,.05));
    if(k===5&&Math.random()<.7)ch.v.forEach((m,i)=>iRhodes(m,t+i*.015,.5,.032));
    if(k===0)iBass(ch.b,t,.75,.17);
    if(k===3&&Math.random()<.6)iBass(ch.b,t,.3,.1);
    if(k===6&&Math.random()<.3)iBass(ch.b+7,t,.3,.09);
    if(k===0)dKick(t,.22);else if((k===3&&Math.random()<.5)||(k===5&&Math.random()<.3))dKick(t,.14);
    if(k===2||k===6)dSnare(t,.1);
    dHat(t,k%2?.05:.03+Math.random()*.01,k===7&&Math.random()<.25);
    if(k%2&&Math.random()<.3){if(st.li===undefined)st.li=2;st.li=Math.max(0,Math.min(6,st.li+rnd([-2,-1,1,2])));iRhodes(PAM[st.li],t,.9,.04)}
    return t+(k%2?.32:.47);
  }},
  {n:'شرقي',f(t){ /* مقام حجاز: عود وطبلة (مقسوم) ونغمة ثابتة */
    const n=MU.step++,k=n%8,bar=n/8|0,st=MU.st;
    if(k===0){
      if(bar%2===0||!st.ph){
        st.ph=[];let i=st.i===undefined?4:st.i;
        for(let x=0;x<8;x++){if(x===0||Math.random()>.35){i=Math.max(0,Math.min(HJ.length-1,i+rnd([-2,-1,-1,0,1,1,2])));st.ph[x]=i}else st.ph[x]=null}
        if(bar%4===3){st.ph[6]=0;st.ph[7]=null}else if(bar%4===1){st.ph[6]=4;st.ph[7]=null}
        st.i=i;
      }
      if(bar%2===0){iPad(50,t,6.4,.03);iPad(57,t+.1,6.4,.022)}
    }
    if(st.ph&&st.ph[k]!==null&&st.ph[k]!==undefined)iOud(HJ[st.ph[k]],t,.85,.065);
    if(k===0){dDum(t,.2);iBass(38,t,.5,.13)}
    else if(k===4){dDum(t,.17);if(Math.random()<.5)iBass(45,t,.4,.1)}
    else if(k===1||k===3||k===6)dTak(t,k===3?.08:.09);
    else if(k===7)dTak(t,.035);
    else if(Math.random()<.5)dTak(t,.025);
    return t+.288;
  }}
];
function muTick(){
  const c=MU.ctx;if(!c||!MU.on)return;
  let g=0;while(MU.next<c.currentTime+1.2&&g++<20)MU.next=TRK[MU.tr].f(MU.next);
}
function muFade(){
  const ob=MU.bus;
  if(ob){try{ob.gain.setTargetAtTime(0,MU.ctx.currentTime,.12)}catch(e){}setTimeout(()=>{try{ob.disconnect()}catch(e){}},1200)}
}
function muPlay(){
  if(!muInitCtx())return;
  try{MU.ctx.resume()}catch(e){}
  muFade();MU.bus=muBus();MU.step=0;MU.st={};MU.next=MU.ctx.currentTime+.15;MU.on=true;
  clearInterval(MU.timer);MU.timer=setInterval(muTick,300);muTick();
}
function muStop(){MU.on=false;clearInterval(MU.timer);muFade();MU.bus=null}
function muSave(){try{localStorage.setItem('bkmusic',JSON.stringify({on:MU.want,tr:MU.tr}))}catch(e){}}
function muUI(){
  const e=$('#mus');if(!e)return;
  e.innerHTML=`<button id="mb" class="${MU.want?'on':''}">${MU.want?'🔊':'🔇'}</button>`+TRK.map((t,i)=>`<button data-t="${i}" class="${MU.want&&MU.tr===i?'on':''}">${t.n}</button>`).join('')+`<button id="mfx" title="مؤثرات صوتية" class="${SF.sfx?'on':''}">🔔</button><button id="mal" title="تنبيه الدور (اهتزاز وإشعار)" class="${SF.al?'on':''}">📳</button>`;
  e.querySelector('#mfx').onclick=()=>{SF.sfx=!SF.sfx;sfSave();if(SF.sfx)sfx('gain');muUI()};
  e.querySelector('#mal').onclick=()=>{SF.al=!SF.al;sfSave();if(SF.al){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();navigator.vibrate&&navigator.vibrate(60)}catch(x){}}muUI()};
  e.querySelector('#mb').onclick=()=>{MU.want=!MU.want;MU.want?muPlay():muStop();muSave();muUI()};
  e.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{MU.tr=+b.dataset.t;MU.want=true;muPlay();muSave();muUI()});
}
/* ===== مؤثرات صوتية وتنبيهات وإشعارات عائمة وردود الفعل ===== */
const SF={sfx:true,al:false},BT=(typeof document!=='undefined'&&document.title)||'';
try{Object.assign(SF,JSON.parse(localStorage.getItem('bkopts')||'{}'))}catch(e){}
function sfSave(){try{localStorage.setItem('bkopts',JSON.stringify(SF))}catch(e){}}
function sfx(n){
  if(!SF.sfx)return;
  try{
    if(!muInitCtx())return;const c=MU.ctx;try{c.resume()}catch(e){}
    const t=c.currentTime+.01;
    const P=(f,dt,d,ty,v)=>{const o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f,t+dt);g.gain.setValueAtTime(.0001,t+dt);g.gain.linearRampToValueAtTime(v,t+dt+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dt+d);o.connect(g);g.connect(MU.master);o.start(t+dt);o.stop(t+dt+d+.05)};
    if(n==='roll')for(let i=0;i<7;i++)P(300+Math.random()*500,i*.09,.06,'square',.04);
    else if(n==='buy')[523,659,784].forEach((f,i)=>P(f,i*.09,.25,'triangle',.12));
    else if(n==='pay')[392,294].forEach((f,i)=>P(f,i*.13,.3,'sine',.14));
    else if(n==='gain')[660,880,1175].forEach((f,i)=>P(f,i*.07,.22,'sine',.1));
    else if(n==='jail'){P(200,0,.5,'sawtooth',.06);P(150,.15,.5,'sawtooth',.06)}
    else if(n==='turn'){P(880,0,.35,'sine',.1);P(1175,.12,.4,'sine',.08)}
  }catch(e){}
}
function toast(txt,cls){
  try{
    const f=$('#fx');if(!f||!f.appendChild)return;
    while(f.children&&f.children.length>=5)f.removeChild(f.firstChild);
    const d=document.createElement('div');d.className='tt '+(cls||'');d.textContent=txt;f.appendChild(d);
    setTimeout(()=>{try{d.remove()}catch(e){}},2300);
  }catch(e){}
}
function turnAlert(){
  sfx('turn');
  if(!SF.al)return;
  try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}
  try{if(document.hidden){document.title='🎲 دورك! — بانكرول';if('Notification' in window&&Notification.permission==='granted')new Notification('بانكرول 🎲',{body:'جاء دورك!'})}}catch(e){}
}
try{document.addEventListener('visibilitychange',()=>{if(!document.hidden)document.title=BT})}catch(e){}
function bkFx(p,s){
  if(!p||!s||s.phase!=='play'||p.phase!=='play'||!p.order)return;
  const me=bk.uid;let bought=false,jailed=false,loss=false,gain=false;
  Object.keys(s.own).forEach(i=>{if(p.own[i]===undefined)bought=true});
  Object.keys(s.jail||{}).forEach(u=>{if(!(p.jail&&p.jail[u]))jailed=true});
  s.order.forEach((u,k)=>{
    if(s.out[u]&&!p.out[u])return;
    const d=(s.cash[u]||0)-(p.cash[u]||0);
    if(!d)return;
    if(d<0)loss=true;else gain=true;
    toast(`${PC[k]} ${d>0?'+':'−'}${Math.abs(d)} 💵`,d>0?'pos':'neg');
    if(u===me&&d<=-100&&!bought&&SF.al){try{navigator.vibrate&&navigator.vibrate(90)}catch(e){}}
  });
  if(bought)sfx('buy');else if(jailed)sfx('jail');else if(loss)sfx('pay');else if(gain)sfx('gain');
  if(s.ev&&(!p.ev||p.ev.txt!==s.ev.txt))toast('📣 '+s.ev.txt,'ev');
  const cu=s.order[s.turn],pc=p.order[p.turn];
  if(cu===me&&pc!==me)turnAlert();
}
function bkRxShow(u,e){const s=bk.state,k=s&&s.order?s.order.indexOf(u):-1;toast((PC[k]||'')+' '+e,'rx')}
function bkRxCast(u,e){bkRxShow(u,e);bk.conns.forEach(c=>{try{c.open&&c.send({t:'rx',u,e})}catch(x){}})}
function bkReact(e){
  if(Date.now()-(bk.rxAt||0)<1000)return;bk.rxAt=Date.now();
  if(bk.host)bkRxCast(bk.uid,e);else{try{bk.conn.send({t:'rx',e})}catch(x){}}
}

try{
  let sv=null;try{sv=JSON.parse(localStorage.getItem('bkmusic')||'null')}catch(e){}
  MU.want=!!(sv&&sv.on);MU.tr=sv&&TRK[sv.tr]?sv.tr:0;muUI();
  if(MU.want){const go=()=>{document.removeEventListener('pointerdown',go);if(MU.want&&!MU.on)muPlay()};document.addEventListener('pointerdown',go)}
}catch(e){}

bkMenu();
</script>
